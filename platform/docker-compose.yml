services:
  init:
    image: alpine:3.20
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        test -s /secrets/db_password || head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/db_password
        test -s /secrets/secret_key || head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/secret_key
        test -s /secrets/owner_password || head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/owner_password
    volumes:
      - secrets:/secrets
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shveya
      POSTGRES_DB: shveya
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - database:/var/lib/postgresql/data
      - secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shveya -d shveya"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PROJECT_NAME: ШВЕЯМОЗГ
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@localhost.local}
      PHOTO_DIR: /app/data/photos
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DELIVERY_PROVIDER: ${DELIVERY_PROVIDER:-partner}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_OPERATOR_CHAT_ID_VLAD: ${TELEGRAM_OPERATOR_CHAT_ID_VLAD:-}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_CALLBACK_SECRET: ${VK_CALLBACK_SECRET:-}
      VK_CONFIRMATION_CODE: ${VK_CONFIRMATION_CODE:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      YANDEX_DELIVERY_TOKEN: ${YANDEX_DELIVERY_TOKEN:-}
      YANDEX_GEOCODER_KEY: ${YANDEX_GEOCODER_KEY:-}
      YANDEX_SPEECHKIT_API_KEY: ${YANDEX_SPEECHKIT_API_KEY:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-}
    volumes:
      - secrets:/run/secrets:ro
      - photos:/app/data/photos
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  secrets:
  photos:
